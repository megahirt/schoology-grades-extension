# Release — Grades Dashboard for Schoology
#
# Trigger: pushing a tag vX.Y.Z (e.g. v1.4.0) that points at a commit on
# main. The tag is the ONLY source of the version: the build writes it into
# every manifest (extension/manifest.json and package.json stay at 0.0.0),
# the GitHub Release is named after it, and the promo site is redeployed so
# it shows the new version.
#
#   1. Write the "## 1.4.0" section of RELEASE_NOTES.md and commit it on main
#      (a release without notes for its version stops at verify).
#   2. git checkout main && git pull
#      git tag v1.4.0 && git push origin v1.4.0
#
# That section is the release's text everywhere: the What's new note the
# extension shows after updating (bundled by the build), the App Store's
# What's New, the Firefox release notes, and the top of the GitHub Release
# (followed by GitHub's list of merged PRs). scripts/release-notes.mjs.
#
# Jobs:
#   1. verify  — tag is vX.Y.Z (no leading zeros), its commit is on main,
#                and RELEASE_NOTES.md has a section for the version.
#   2. build   — lint + unit tests, then Chrome/Edge, Firefox and Safari
#                builds stamped with the version, zipped, plus a ZIP of the
#                source (Mozilla's reviewers rebuild from it), with SHA256SUMS.
#   3. stores  — no store is still reviewing an earlier version
#                (scripts/store-status.mjs); else everything waits.
#                Owner approval (the `release` environment).
#   4. release — GitHub Release for the tag (generated notes + the zips),
#                then redeploys the site (pages.yml) to show the version.
#   5. chrome / edge / firefox / safari — store jobs. They run in the `release` environment
#                (owner approval gate + store secrets). Chrome and Safari
#                are set up and fail if their secrets go missing; Edge and
#                Firefox skip, without failing, until theirs are set; see
#                docs/release-plan.md. The `release` environment must allow
#                tags matching v* (Settings → Environments → release →
#                Deployment branches and tags), or these jobs can't start.
#
# A store failure never blocks the GitHub Release: the store jobs run after it.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is vX.Y.Z on main
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z (e.g. v1.4.0, no leading zeros). No release made."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG#v} from $GITHUB_SHA"

      - name: Check RELEASE_NOTES.md has this version's notes
        run: node scripts/release-notes.mjs --version "${GITHUB_REF_NAME#v}" --format check

  build:
    runs-on: ubuntu-latest
    needs: verify
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test

      - name: Build Chrome/Edge, Firefox and Safari
        run: |
          node scripts/build.mjs
          node scripts/build.mjs --firefox
          node scripts/build.mjs --safari

      - name: Check every build carries the tag's version
        run: |
          for d in dist dist-firefox dist-safari; do
            got=$(node -p "require('./$d/manifest.json').version")
            echo "$d: $got"
            if [ "$got" != "$RELEASE_VERSION" ]; then
              echo "::error::$d/manifest.json has version $got, expected $RELEASE_VERSION"
              exit 1
            fi
            if grep -q localhost "$d/manifest.json"; then
              echo "::error::$d/manifest.json contains localhost (a dev build?)"
              exit 1
            fi
          done

      - name: Package ZIPs and checksums
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/schoology-grades-extension-${RELEASE_VERSION}-chrome.zip" .)
          (cd dist-firefox && zip -qr "../out/schoology-grades-extension-${RELEASE_VERSION}-firefox.zip" .)
          (cd dist-safari && zip -qr "../out/schoology-grades-extension-${RELEASE_VERSION}-safari.zip" .)
          # The source at this tag, for Mozilla's reviewers (store/firefox/SOURCE.md).
          git archive --format=zip -o "out/schoology-grades-extension-${RELEASE_VERSION}-source.zip" HEAD
          (cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  stores:
    # Is any store still busy with an earlier version (in review, or
    # approved and not out yet)? Then stop here, before the GitHub Release
    # or any upload: the release waits for those reviews instead of
    # replacing them. Once they're done, "Re-run failed jobs" carries on.
    # scripts/store-status.mjs; the same check runs any time from the Store
    # status workflow. Runs in the `release` environment (its store keys),
    # so it waits for the owner's approval like the store jobs.
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ask each store whether a review is in progress
        env:
          CWS_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON_B64 }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: node scripts/store-status.mjs --version "${{ needs.verify.outputs.version }}"

  release:
    runs-on: ubuntu-latest
    needs: [verify, build, stores]
    permissions:
      contents: write   # create the Release
      actions: write    # start the Pages workflow
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Create the GitHub Release
        # The text: this version's release notes, the files, then GitHub's
        # generated list of the merged PRs.
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes \
            --notes "$(node scripts/release-notes.mjs --version "$VERSION" --format github)

          ### Downloads

          - \`schoology-grades-extension-$VERSION-chrome.zip\`: Chrome and Edge (Load unpacked, or the store upload).
          - \`schoology-grades-extension-$VERSION-firefox.zip\`: Firefox.
          - \`schoology-grades-extension-$VERSION-safari.zip\`: Safari input (Add Temporary Extension, or Apple's packager).
          - \`schoology-grades-extension-$VERSION-source.zip\`: the source at this tag (for Mozilla's review of the Firefox version).
          - \`SHA256SUMS.txt\`: checksums.

          Store versions follow after review; see https://schoology.hirtfamily.net/"

      - name: Redeploy the site with the new version
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  chrome:
    # Chrome Web Store (API v2, scripts/publish-chrome.mjs): uploads the
    # release's Chrome ZIP and submits it for review as DEFAULT_PUBLISH, so a
    # reviewed update goes live as soon as review passes; approving this job
    # is the go-live decision. Runs in the `release` environment (owner
    # approval). Needs the service account key and IDs
    # (docs/chrome-web-store-setup.md §4).
    runs-on: ubuntu-latest
    needs: [verify, release]
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Upload to the Chrome Web Store and submit for review
        env:
          CWS_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON_B64 }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_PUBLISH_TYPE: DEFAULT_PUBLISH
        run: node scripts/publish-chrome.mjs "out/schoology-grades-extension-${VERSION}-chrome.zip"


  edge:
    # Microsoft Edge Add-ons (Update REST API v1.1, scripts/publish-edge.mjs):
    # uploads the release's Chrome ZIP (Edge takes it as is) into the
    # product's DRAFT. It never publishes: the owner clicks Publish in
    # Partner Center, which sends the draft to certification. Runs in the
    # `release` environment (owner approval). Skips, without failing, until
    # the API key and IDs are set (docs/edge-add-ons-setup.md §3).
    runs-on: ubuntu-latest
    needs: [verify, release]
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check Edge Add-ons settings
        id: edge
        # Secrets go in through env, never pasted into the script itself.
        env:
          EDGE_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT: ${{ vars.EDGE_CLIENT_ID }}
        run: |
          if [ -n "$EDGE_KEY" ] && [ -n "$EDGE_PRODUCT" ] && [ -n "$EDGE_CLIENT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.edge.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Node 24
        if: steps.edge.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release files
        if: steps.edge.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Upload to the Edge Add-ons draft
        if: steps.edge.outputs.configured == 'true'
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
        run: node scripts/publish-edge.mjs "out/schoology-grades-extension-${VERSION}-chrome.zip"

      - name: Skip (not set up yet)
        if: steps.edge.outputs.configured != 'true'
        run: |
          echo "SKIPPED: Edge Add-ons upload. Set the EDGE_API_KEY secret and the EDGE_PRODUCT_ID and EDGE_CLIENT_ID variables (docs/edge-add-ons-setup.md); not a failure."

  firefox:
    # addons.mozilla.org (web-ext sign, Mozilla's own tool): submits the
    # release's Firefox ZIP as a new LISTED version, with the source ZIP
    # that reviewers rebuild from. AMO has no "wait after review" state: the
    # version goes live once Mozilla approves it, so the owner's approval of
    # this job (the `release` environment) is the go-live decision. Skips,
    # without failing, until the API keys are set
    # (docs/firefox-amo-setup.md §4). The listing itself is made by hand
    # first (§3); this job only adds versions to it.
    runs-on: ubuntu-latest
    needs: [verify, release]
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check addons.mozilla.org settings
        id: amo
        # Secrets go in through env, never pasted into the script itself.
        env:
          AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_ISSUER" ] && [ -n "$AMO_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.amo.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Node 24
        if: steps.amo.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.amo.outputs.configured == 'true'
        run: npm ci

      - name: Download release files
        if: steps.amo.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Submit to addons.mozilla.org
        if: steps.amo.outputs.configured == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --approval-timeout 0: submit and finish; don't wait for the review.
        # Release notes = this version's section of RELEASE_NOTES.md, as
        # plain text (the same as the App Store's What's New).
        run: |
          mkdir -p amo-package
          unzip -q "out/schoology-grades-extension-${VERSION}-firefox.zip" -d amo-package
          node scripts/release-notes.mjs --version "$VERSION" --format amo > amo-metadata.json
          npx web-ext sign \
            --source-dir amo-package \
            --artifacts-dir amo-artifacts \
            --channel listed \
            --upload-source-code "out/schoology-grades-extension-${VERSION}-source.zip" \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --no-input

      - name: Skip (not set up yet)
        if: steps.amo.outputs.configured != 'true'
        run: |
          echo "SKIPPED: addons.mozilla.org submission. Set the AMO_JWT_ISSUER and AMO_JWT_SECRET secrets (docs/firefox-amo-setup.md); not a failure."

  safari:
    # App Store (scripts/upload-safari.mjs + scripts/submit-appstore.mjs): on
    # a macOS runner, builds the Xcode project for this tag, archives the Mac
    # and iOS apps, signs them with cloud-managed signing through the App
    # Store Connect API key (no certificates stored), uploads both, then
    # submits version X.Y.Z for review. It is released automatically once
    # Apple approves it, so approving this job is the go-live decision.
    # Build number = run number x 100 + attempt, so re-running the job
    # uploads a fresh build. "What's New" = this version's section of
    # RELEASE_NOTES.md, as plain text. Re-running the job after a
    # failure is safe. Needs the App Store Connect key and APPLE_TEAM_ID
    # (docs/safari.md, "Releases from GitHub Actions").
    runs-on: macos-26
    needs: [verify, release]
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Build number (run number x 100 + attempt)
        run: |
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Build the Xcode project
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: npm run build:safari

      - name: Archive, sign and upload the Mac and iOS apps
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: node scripts/upload-safari.mjs

      - name: Submit for App Review
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          export WHATS_NEW="$(node scripts/release-notes.mjs --version "$VERSION" --format appstore)"
          node scripts/submit-appstore.mjs --version "$VERSION" --build "$BUILD_NUMBER"
