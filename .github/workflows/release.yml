# Release — Grades Dashboard for Schoology
#
# Trigger: pushing a tag vX.Y.Z (e.g. v1.4.0) that points at a commit on
# main. The tag is the ONLY source of the version: the build writes it into
# every manifest (extension/manifest.json and package.json stay at 0.0.0),
# the GitHub Release is named after it, and the promo site is redeployed so
# it shows the new version.
#
#   git checkout main && git pull
#   git tag v1.4.0 && git push origin v1.4.0
#
# Jobs:
#   1. verify  — tag is vX.Y.Z (no leading zeros) and its commit is on main.
#   2. build   — lint + unit tests, then Chrome/Edge, Firefox and Safari
#                builds stamped with the version, zipped, with SHA256SUMS.
#   3. release — GitHub Release for the tag (generated notes + the zips),
#                then redeploys the site (pages.yml) to show the version.
#   4. chrome / safari — store jobs. They run in the `release` environment
#                (owner approval gate + store secrets) and skip gracefully
#                until their secrets and real upload steps exist; see
#                docs/release-plan.md. The `release` environment must allow
#                tags matching v* (Settings → Environments → release →
#                Deployment branches and tags), or these jobs can't start.
#
# A store failure never blocks the GitHub Release: the store jobs run after it.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is vX.Y.Z on main
        id: version
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z (e.g. v1.4.0, no leading zeros). No release made."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG#v} from $GITHUB_SHA"

  build:
    runs-on: ubuntu-latest
    needs: verify
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test

      - name: Build Chrome/Edge, Firefox and Safari
        run: |
          node scripts/build.mjs
          node scripts/build.mjs --firefox
          node scripts/build.mjs --safari

      - name: Check every build carries the tag's version
        run: |
          for d in dist dist-firefox dist-safari; do
            got=$(node -p "require('./$d/manifest.json').version")
            echo "$d: $got"
            if [ "$got" != "$RELEASE_VERSION" ]; then
              echo "::error::$d/manifest.json has version $got, expected $RELEASE_VERSION"
              exit 1
            fi
            if grep -q localhost "$d/manifest.json"; then
              echo "::error::$d/manifest.json contains localhost (a dev build?)"
              exit 1
            fi
          done

      - name: Package ZIPs and checksums
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/schoology-grades-extension-${RELEASE_VERSION}-chrome.zip" .)
          (cd dist-firefox && zip -qr "../out/schoology-grades-extension-${RELEASE_VERSION}-firefox.zip" .)
          (cd dist-safari && zip -qr "../out/schoology-grades-extension-${RELEASE_VERSION}-safari.zip" .)
          (cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [verify, build]
    permissions:
      contents: write   # create the Release
      actions: write    # start the Pages workflow
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: Create the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Grades Dashboard for Schoology v$VERSION.

          - \`schoology-grades-extension-$VERSION-chrome.zip\`: Chrome and Edge (Load unpacked, or the store upload).
          - \`schoology-grades-extension-$VERSION-firefox.zip\`: Firefox.
          - \`schoology-grades-extension-$VERSION-safari.zip\`: Safari input (Add Temporary Extension, or Apple's packager).
          - \`SHA256SUMS.txt\`: checksums.

          Store versions follow after review; see https://megahirt.github.io/schoology-grades-extension/install.html"

      - name: Redeploy the site with the new version
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  chrome:
    # Chrome Web Store. Scaffold: skips until the CWS secrets exist. The
    # real upload (Chrome Web Store API v2, STAGED_PUBLISH) is Phase 2 of
    # docs/release-plan.md.
    runs-on: ubuntu-latest
    needs: [verify, release]
    environment: release
    steps:
      - name: Check Chrome Web Store secrets
        id: cws
        run: |
          if [ -n "${{ secrets.CWS_SERVICE_ACCOUNT_JSON_B64 }}" ] && [ -n "${{ vars.CWS_EXTENSION_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the Chrome Web Store
        if: steps.cws.outputs.configured == 'true'
        run: |
          echo "Chrome Web Store secrets are set, but the API v2 upload isn't built yet (docs/release-plan.md, Phase 2)."

      - name: Skip (no secrets)
        if: steps.cws.outputs.configured != 'true'
        run: echo "SKIPPED: Chrome Web Store upload. Secrets not set yet; not a failure."

  safari:
    # App Store Connect. Scaffold: the Xcode project, archive and TestFlight
    # upload are Phase 3 of docs/release-plan.md. Version for Apple:
    # MARKETING_VERSION = the tag's X.Y.Z, build number = github.run_number.
    runs-on: ubuntu-latest
    needs: [verify, release]
    environment: release
    steps:
      - name: Check App Store Connect secrets
        id: asc
        run: |
          if [ -n "${{ secrets.ASC_API_KEY_ID }}" ] && [ -n "${{ secrets.ASC_API_ISSUER_ID }}" ] && [ -n "${{ secrets.ASC_API_KEY_P8_B64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to TestFlight
        if: steps.asc.outputs.configured == 'true'
        run: |
          echo "App Store Connect key is set. The archive + TestFlight upload isn't built yet (docs/release-plan.md, Phase 3)."
          echo "It will ship version ${{ needs.verify.outputs.version }} as build ${{ github.run_number }}."

      - name: Skip (no secrets)
        if: steps.asc.outputs.configured != 'true'
        run: echo "SKIPPED: App Store Connect upload. Secrets not set yet; not a failure."
