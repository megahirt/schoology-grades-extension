<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schoology Dashboard</title>
<style>
  body { width: 460px; margin: 0; background: #fff; }
  /* "Use Schoology Dashboard here", on a school's own Schoology address. */
  .school-offer { margin: 12px 12px 0; padding: 12px 14px; border: 1px solid #c7d7fb; border-radius: 12px; background: #f3f7ff;
    font: 13px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #111827; }
  .school-offer[hidden] { display: none; }
  .school-offer p { margin: 0 0 8px; }
  .school-offer .muted { color: #6b7280; font-size: 12px; margin: 8px 0 0; }
  .school-offer button { height: 34px; padding: 0 14px; border: none; border-radius: 8px; background: #2563eb; color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  .school-offer button:disabled { opacity: 0.6; cursor: default; }
  .school-offer button:focus-visible { outline: 3px solid #93b4f5; outline-offset: 2px; }
</style>
</head>
<body>
<div id="school-offer" class="school-offer" role="region" aria-label="Use on this school's address" hidden>
  <p id="school-offer-text"></p>
  <button id="school-offer-btn" type="button">Use Schoology Dashboard here</button>
  <p id="school-offer-note" class="muted">Your browser will ask to let the extension read this one site. Nothing leaves your browser.</p>
</div>
<div id="dashboard"></div>
<script src="popup.js"></script>
</body>
</html>
